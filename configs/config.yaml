# Motion-controlled video generation: LTX-Video + trajectory adapter.
# Every script reads this file; CLI flags override individual values.

model:
  id: Lightricks/LTX-Video-0.9.7-dev
  dtype: bfloat16                # dtype of the frozen LTX weights
  prompt: "A high quality video with smooth, natural motion."
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  gradient_checkpointing: true   # needed to backprop through the 13B transformer
  vae_tiling: false

adapter:
  mode: multilayer               # input = add once at the input; multilayer = ControlNet-style, every inject_every-th block
  inject_every: 4                # multilayer only: 48 blocks / 4 = 12 injection points
  relative: true                 # multilayer: inject relative to the hidden-state RMS (absolute injection is easily drowned out)
  entity_embedding: true         # entity condition: also paint the object's own latent feature (set false if the model memorises scenes)
  condition: entity              # points = heatmap+flow of one point; entity = object-sized Gaussian + object feature (needs masks, see scripts/make_masks.py)

data:
  root: data/dataset
  num_frames: 17                 # must be 8k+1 and <= the shortest clip (your clips have 24 frames)
  height: 480                    # must be a multiple of 32
  width: 864                     # must be a multiple of 32
  num_workers: 0
  augment: true                  # train only: a random tracked point (tracks.npy) per visit + random mirror flip; fights overfitting on few scenes
  repeat: 8                      # train only: visits per clip per epoch (each visit = new random crop/track/flip). Updates per epoch = clips * repeat / grad_accum

train:
  batch_size: 1
  grad_accum: 4
  epochs: 10
  lr: 5.0e-4                     # condition encoder + adapter projections (peak; warmup + cosine decay, see below)
  warmup_frac: 0.05              # fraction of all updates spent warming the lr up from 0
  lr_floor: 0.1                  # cosine decay ends at this fraction of lr
  scale_lr: 2.0e-2               # adapter gate starts at 0; too low and the adapter has no effect
  weight_decay: 0.0
  grad_clip: 1.0
  save_dir: checkpoints
  log_every: 16                  # steps (visits) between printed loss lines
  save_every: 1                  # epochs
  seed: 0
  cond_dropout: 0.1              # fraction of samples trained without the trajectory (enables motion_guidance)
  max_val_samples: 16            # val clips used for the per-epoch val loss

inference:
  steps: 30
  guidance_scale: 1.0            # >1 enables classifier-free guidance on the text prompt
  decode_timestep: 0.05
  motion_guidance: 1.0           # >1 amplifies the trajectory (e.g. 2-4); costs a second forward pass per step
  fps: 24
  seed: 0

# Applied by --tiny: a randomly initialised miniature LTX that runs on CPU in
# seconds. Used to verify the whole pipeline without downloading 13B weights.
tiny:
  dtype: float32
  num_frames: 17
  height: 64
  width: 96
  epochs: 2
  grad_accum: 1
  steps: 4
