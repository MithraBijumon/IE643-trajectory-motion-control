# LTX-Video 2B + trajectory adapter (the "classic" recipe). Every script reads this file; CLI flags override single values.
# The injection is small (~0.1-0.7% of the hidden state): raise it at inference with --adapter_scale (3 was benchmarked).

model:
  id: Lightricks/LTX-Video-0.9.5
  dtype: bfloat16                # dtype of the frozen LTX weights (float16 on GPUs without bf16)
  prompt: "A static camera shot of a single subject in a real, natural scene. The subject moves smoothly and steadily, keeping its exact shape, colors and texture, while the background stays still and sharp. Realistic lighting, high quality, detailed, stable footage, natural motion."
  negative_prompt: "worst quality, blurry, jittery, distorted, deformed, morphing, melting, flickering, warping, low resolution, inconsistent motion, extra objects, text, watermark"
  gradient_checkpointing: true
  vae_tiling: false

adapter:
  inject_every: 2                # inject after every 2nd frozen LTX block
  cond_blocks: 2                 # small trainable transformer blocks (dim 128) on the condition tokens
  cond_heads: 4
  local_inject: 2.0              # inject only near the object (footprint radius = 2 x the object's); 0 = everywhere
  relative: true                 # inject relative to the hidden-state RMS
  entity_embedding: true         # also paint the object's own latent feature
  mask_shape: true               # paint the object's real silhouette instead of a round blob
  embedding_dropout: 0.3         # hide the object feature in this fraction of training steps
  max_inject: 0.05               # cap on |injection| / |hidden state|
  inject_cap: global             # 'global' = cap on the RMS over all tokens, 'token' = cap on every token

data:
  root: data/dataset_got10k
  num_frames: 33                 # 8k+1, <= the shortest clip
  height: 480                    # multiple of 32
  width: 864                     # multiple of 32
  rope_fps: 24
  num_workers: 4
  captions: true                 # per-clip prompt from <clip>/caption.txt (scripts/caption_clips.py)
  mask_loss: true                # SAM 2 per-frame masks weight the loss on the object
  augment: true                  # random tracked point + mirror flip
  repeat: 2                      # visits per clip per epoch

train:
  batch_size: 1
  grad_accum: 1
  epochs: 10
  max_visits_per_epoch: 256
  lr: 3.0e-5                     # 5e-4 diverged
  warmup_frac: 0.05
  lr_floor: 0.1                  # cosine decay ends at this fraction of lr
  weight_decay: 0.0
  grad_clip: 1.0
  save_dir: checkpoints
  log_every: 16
  save_every: 1
  seed: 0
  focus_loss: 5.0                # object tokens weighted 5x; object and background averaged separately
  time_ramp: 1.0                 # object weight grows over time (2x in the last latent frame)
  sigma_mean: 0.5                # sample noisier timesteps more often
  cond_dropout: 0.1              # share of samples trained without the trajectory (enables motion_guidance)
  max_val_samples: 16

inference:
  steps: 40
  adapter_scale: 1.0             # strength of the adapter residual (1 = as trained, 0 = off)
  adapter_min_sigma: 0.0         # the adapter acts only while sigma >= this
  ref_init: 0.0                  # >0 (e.g. 0.8): start from the drag video noised to this sigma
  bg_comp: 0.0                   # >0 (e.g. 2.5): with the drag video, put the object-free scene back outside this many object radii
  bg_comp_release: 0.25
  guidance_scale: 3.0
  decode_timestep: 0.05
  motion_guidance: 1.0           # >1 amplifies the trajectory (costs a second forward pass per step)
  fps: 24
  seed: 0

# Applied by --tiny: a randomly initialised miniature LTX that runs on CPU in seconds (pipeline check).
tiny:
  dtype: float32
  num_frames: 17
  height: 64
  width: 96
  epochs: 2
  grad_accum: 1
  steps: 4
